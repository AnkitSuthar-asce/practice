spring.application.name=springdemo1
server.port=8100
# Database Configuration (H2 In-Memory for testing, swap with MySQL/PostgreSQL if needed)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Custom JWT Configuration (Replaces the hardcoded value in Jwutil)
jwt.secret=Secret-Key-32-byte-WIPRO-JAVA--FSD-Sucess!
