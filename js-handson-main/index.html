<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager (CRUD)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Record Management</h1>
            <p>Full CRUD Operations via Fetch API</p>
        </header>

        <main class="card-layout">
            <section class="form-card">
                <h2 id="form-title">Add New Student</h2>
                <form id="student-form">
                    <input type="hidden" id="student-id">
                    
                    <div class="form-group">
                        <label for="student-name">Student Name</label>
                        <input type="text" id="student-name" required placeholder="Enter full name">
                    </div>

                    <div class="form-group">
                        <label for="student-email">Email Address</label>
                        <input type="email" id="student-email" required placeholder="name@example.com">
                    </div>

                    <div class="form-group">
                        <label for="student-course">Course Enrolled</label>
                        <input type="text" id="student-course" required placeholder="e.g., Computer Science">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel Edit</button>
                    </div>
                </form>
            </section>

            <section class="data-card">
                <div class="table-header-tools">
                    <h2>Enrolled Students</h2>
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Search students by name...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="students-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
